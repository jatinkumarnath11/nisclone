services:
  postgres:
    image: postgres:16-alpine
    container_name: ums_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ums_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ums_secure_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ums_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ums_user} -d ${POSTGRES_DB:-ums_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ums_network

  redis:
    image: redis:7-alpine
    container_name: ums_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ums_network

  # Optional production / containerized services
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ums_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ums_user}:${POSTGRES_PASSWORD:-ums_secure_password_dev}@postgres:5432/${POSTGRES_DB:-ums_dev}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-ums_dev_access_token_secret_replace_in_production_key_32bytes!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-ums_dev_refresh_token_secret_replace_in_production_key_32bytes!}
    ports:
      - "5000:5000"
    networks:
      - ums_network
    profiles:
      - full-stack

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: ums_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
    networks:
      - ums_network
    profiles:
      - full-stack

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ums_network:
    driver: bridge
